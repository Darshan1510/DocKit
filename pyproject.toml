[project]
name = "pdf-compressor"
version = "0.1.0"
description = "A small desktop app with everyday PDF tools: compress, merge, split, organize, convert, watermark and protect."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.135.3",
  "img2pdf>=0.6.3",
  "pikepdf>=9.0",
  "pillow>=12.2.0",
  "pyinstaller>=6.19.0",
  "pypdfium2>=5.15.2",
  "python-multipart>=0.0.24",
  "pywebview>=6.1",
  "reportlab>=5.1.0",
  "uvicorn>=0.43.0",
]
